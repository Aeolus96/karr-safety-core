; ============================================================================
; K.A.R.R. (Keystone Autonomous Resource Rover) — safety & relay controller
; Firmware project: ESP32-RELAY-FW — e-stop / lighting relay baseline
; Target: Waveshare ESP32-S3-POE-ETH-8DI-8RO-C
;         (8x relays via TCA9554, 8x digital inputs, W5500 ETH)
; RC: Turnigy TGY-i6S transmitter + iA6B receiver (i-BUS)
; Transport: micro-ROS over Ethernet only (no WiFi / BT / MQTT / RS485)
; ============================================================================
[env:esp32s3-relay-controller]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
board = esp32-s3-devkitm-1
framework = arduino

upload_speed = 921600
monitor_speed = 115200
upload_protocol = esptool

board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.flash_mode = qio
board_build.f_flash = 80000000L
board_build.arduino.memory_type = qio_opi
board_build.psram_type = opi
board_build.f_cpu = 240000000L
board_build.partitions = partitions_16MB_3MB_app_9_9MB_fatfs.csv

lib_deps =
    https://github.com/micro-ROS/micro_ros_platformio
    ; IBusBM (i-BUS RC receiver) is deliberately a LOCAL copy in lib/IBusBM:
    ; the registry version v1.1.4 uses the pre-3.0 ESP32 timer API
    ; (timerBegin(id, divider, countUp) / timerAlarmWrite / timerAlarmEnable)
    ; which does NOT compile on arduino-esp32 3.x. The local copy carries the
    ; 3.x API fix — see NOTES.md "IBusBM: registry vs local" for the diff.

; micro-ROS build configuration (processed by micro_ros_platformio)
board_microros_distro = jazzy
board_microros_transport = ethernet
board_microros_user_meta = micro_ros.meta

build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    ; ---- W5500 SPI Ethernet pins (consumed by the micro-ROS ethernet
    ;      transport, which performs ETH.begin() itself) ----
    -DETH_PHY_TYPE=ETH_PHY_W5500
    -DETH_PHY_ADDR=1
    -DETH_PHY_RST=39
    -DETH_PHY_CS=16
    -DETH_PHY_IRQ=12
    -DETH_PHY_SPI=SPI
    -DETH_SPI_MISO=14
    -DETH_SPI_MOSI=13
    -DETH_SPI_SCK=15
